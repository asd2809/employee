spring:
    application:
      name: employee-onboarding-backend
    datasource:
      url: jdbc:mysql://127.0.0.1:3306/employee_system(数据库名)?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: 你的mysql的用户名
      password: 你的mysql的密码
      driver-class-name: com.mysql.cj.jdbc.Driver
    profiles:
      active: local
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  # HS256 签名密钥，长度至少 32 字节，生产环境请改为从环境变量读取
  secret: employee-onboarding-jwt-secret-key-please-change-in-production-2026
  issuer: employee-onboarding-backend
  # 令牌有效期（秒），默认 2 小时
  expire-seconds: 7200
  header: Authorization
  prefix: "Bearer "